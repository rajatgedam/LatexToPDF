name: Release

# Push a tag like v0.3.0 to publish every bundle. "Run workflow" (manual) only builds and smoke-tests; it never publishes.
# A manual run builds the all-in-one bundle on each OS; tick "full" to build every bundle like a release would.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      full:
        description: "Build every bundle (slower), not just the all-in-one"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan bundles
    runs-on: ubuntu-latest
    outputs:
      bundles: ${{ steps.plan.outputs.bundles }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: plan
        env:
          FULL: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.full }}
        run: |
          flag=""; if [ "$FULL" = "true" ]; then flag="--full"; fi
          node scripts/plan-release.mjs $flag --github-output
          node scripts/plan-release.mjs $flag | head -c 3000

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.bundles) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm --prefix web ci
      - run: node bin/toolmaster.mjs install ${{ matrix.tools }}
      - run: npm run build:web
      - run: node bin/toolmaster.mjs warmup ${{ matrix.tools }}
      - name: Package (${{ matrix.runtime }} runtime, bundle ${{ matrix.bundle }})
        shell: bash
        run: npm run package -- --tools ${{ matrix.bundle }} --runtime ${{ matrix.runtime }} --zip
      - name: Smoke test the packaged bundle (offline)
        shell: bash
        run: |
          expect=""; if [ "${{ matrix.bundle }}" = "all" ]; then expect="--expect all"; fi
          for d in dist/ToolMaster-*/; do node scripts/smoke-bundle.mjs "$d" $expect; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ToolMaster-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  docker:
    name: Docker ${{ matrix.img.image }} ${{ matrix.arch.arch }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: plan
    runs-on: ${{ matrix.arch.os }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
        img: ${{ fromJSON(needs.plan.outputs.images) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          tag="${{ matrix.img.image }}:${GITHUB_REF_NAME}-${{ matrix.arch.arch }}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --build-arg TOOLS=${{ matrix.img.tools }} -t "$owner/$tag" .
          docker push "$owner/$tag"

  docker-manifest:
    name: Docker manifest ${{ matrix.img.image }}
    needs: [plan, docker]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        img: ${{ fromJSON(needs.plan.outputs.images) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Create and push multi-arch manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.img.image }}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$img:${GITHUB_REF_NAME}" -t "$img:latest" \
            "$img:${GITHUB_REF_NAME}-amd64" "$img:${GITHUB_REF_NAME}-arm64"
