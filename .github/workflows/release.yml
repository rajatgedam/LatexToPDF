name: Release

# Push a tag like v0.2.0 to publish. "Run workflow" (manual) only builds and tests the artifacts, it never publishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: darwin-arm64 }
          - { os: macos-15-intel, name: darwin-x64 }
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: windows-latest, name: win32-x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm --prefix web ci
      - run: node bin/toolmaster.mjs install
      - run: npm run build:web
      - run: node bin/toolmaster.mjs warmup
      - name: Package every bundle (all tools, and each tool on its own)
        shell: bash
        run: |
          for bundle in all latex-to-pdf latex-to-docx; do
            npm run package -- --tools "$bundle" --zip
          done
      - name: Smoke test every packaged bundle (offline)
        shell: bash
        env:
          TOOLMASTER_OFFLINE: "1"
        run: |
          for d in dist/ToolMaster-*/; do
            exe="$d$(ls "$d" | grep -E '^toolmaster(\.exe)?$')"
            echo "== $d"
            "$exe" list --json > "$RUNNER_TEMP/list.json"
            for pair in latex-to-pdf:pdf latex-to-docx:docx; do
              id="${pair%%:*}"; ext="${pair##*:}"
              if grep -q "\"id\":\"$id\"" "$RUNNER_TEMP/list.json"; then
                "$exe" sample "$id" > "$RUNNER_TEMP/in.txt"
                "$exe" "$id" -i "$RUNNER_TEMP/in.txt" -o "$RUNNER_TEMP/smoke-$id.$ext" --json
                test -s "$RUNNER_TEMP/smoke-$id.$ext"
              else
                echo "($id is not part of this bundle)"
                case "$d" in *-all-*) echo "all bundle must include $id"; exit 1;; esac
              fi
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ToolMaster-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  docker:
    name: Docker ${{ matrix.image }} ${{ matrix.arch }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        image: [toolmaster, toolmaster-latex-to-pdf, toolmaster-latex-to-docx]
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { image: toolmaster, tools: all }
          - { image: toolmaster-latex-to-pdf, tools: latex-to-pdf }
          - { image: toolmaster-latex-to-docx, tools: latex-to-docx }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          tag="${{ matrix.image }}:${GITHUB_REF_NAME}-${{ matrix.arch }}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --build-arg TOOLS=${{ matrix.tools }} -t "$owner/$tag" .
          docker push "$owner/$tag"

  docker-manifest:
    name: Docker manifest ${{ matrix.image }}
    needs: docker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [toolmaster, toolmaster-latex-to-pdf, toolmaster-latex-to-docx]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Create and push multi-arch manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$img:${GITHUB_REF_NAME}" -t "$img:latest" \
            "$img:${GITHUB_REF_NAME}-amd64" "$img:${GITHUB_REF_NAME}-arm64"
