name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix web audit --omit=dev --audit-level=high
      - run: node bin/toolmaster.mjs install
      - run: npm run build:web
      - run: npm run test:web
      - name: Backend unit + integration tests with coverage gate (80% lines)
        run: npm run coverage

  docker:
    name: Docker (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: all, tools: all, expect: 2 }
          - { name: latex-to-docx only, tools: latex-to-docx, expect: 1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build
        run: docker build --build-arg TOOLS=${{ matrix.tools }} -t toolmaster:ci .
      - name: Run hardened (non-root, read-only rootfs, no capabilities)
        run: |
          docker run -d --name tm -p 127.0.0.1:5757:5757 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            toolmaster:ci
      - name: Catalog, conversions, non-root and Host checks
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5757/api/health && break; sleep 1; done
          test "$(curl -sf http://127.0.0.1:5757/api/tools | grep -o '"id":"' | wc -l)" = "${{ matrix.expect }}"
          run_tool() { # id extension
            node bin/toolmaster.mjs sample "$1" > "$RUNNER_TEMP/in-$1.txt"
            code=$(curl -s -o "$RUNNER_TEMP/out-$1.$2" -w '%{http_code}' -X POST -H 'content-type: text/plain' \
              --data-binary @"$RUNNER_TEMP/in-$1.txt" "http://127.0.0.1:5757/api/tools/$1/run")
            if [ "$code" != "200" ]; then echo "$1 returned HTTP $code"; cat "$RUNNER_TEMP/out-$1.$2"; exit 1; fi
          }
          if curl -sf http://127.0.0.1:5757/api/tools | grep -q '"id":"latex-to-docx"'; then
            run_tool latex-to-docx docx
            head -c 2 "$RUNNER_TEMP/out-latex-to-docx.docx" | grep -q PK
          fi
          if curl -sf http://127.0.0.1:5757/api/tools | grep -q '"id":"latex-to-pdf"'; then
            run_tool latex-to-pdf pdf
            head -c 5 "$RUNNER_TEMP/out-latex-to-pdf.pdf" | grep -q '%PDF-'
          fi
          test "$(docker exec tm id -u)" != "0"
          curl -s -o /dev/null -w '%{http_code}\n' -H 'Host: evil.test' http://127.0.0.1:5757/api/health | grep -q 403
      - name: Container logs on failure
        if: failure()
        run: docker logs tm
