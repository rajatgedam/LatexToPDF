name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix web audit --omit=dev --audit-level=high
      - run: node bin/toolmaster.mjs install
      - run: npm run build:web
      - run: npm run test:web
      - name: Backend unit + integration tests with coverage gate (80% lines)
        run: npm run coverage
      - name: Catalog is up to date
        run: node scripts/gen-catalog.mjs --check

  lite-bundle:
    name: Lite bundle smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run build:web
      - name: Build the engine-free tools as a lite bundle and run it
        run: |
          npm run package -- --tools pdf-pages --runtime node --zip
          node scripts/smoke-bundle.mjs dist/ToolMaster-pdf-pages-lite
          unzip -l dist/ToolMaster-pdf-pages-lite.zip | tail -1

  docker:
    name: Docker (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: all, tools: all, expect: 4 }
          - { name: latex-to-docx only, tools: latex-to-docx, expect: 1 }
          - { name: pdf-pages only, tools: pdf-pages, expect: 1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build
        run: docker build --build-arg TOOLS=${{ matrix.tools }} -t toolmaster:ci .
      - name: Run hardened (non-root, read-only rootfs, no capabilities)
        run: |
          docker run -d --name tm -p 127.0.0.1:5757:5757 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            toolmaster:ci
      - name: Every tool runs over HTTP; non-root; foreign Host refused
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5757/api/health && break; sleep 1; done
          node scripts/smoke-http.mjs http://127.0.0.1:5757 ${{ matrix.expect }}
          test "$(docker exec tm id -u)" != "0"
          docker images toolmaster:ci --format 'image size: {{.Size}}'
      - name: Container logs on failure
        if: failure()
        run: docker logs tm
